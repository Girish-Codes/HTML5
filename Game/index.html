<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock - Scissor - Paper</h1>
    <div class="choices">
        <button onclick="playGame('rock')">👊</button>
        <button onclick="playGame('scissor')">✌️</button>
        <button onclick="playGame('paper')">🖐️</button>
    </div>
    <div id="playerDisplay">Player:</div>
    <div id="computerDisplay">Computer:</div>
    <div id="resultDisplay"></div>

    <div id="scoreDisplay">Player Score: <span id="playerScoreDisplay">0</span></div>
    <div id="scoreDisplay">Computer Score: <span id="computerScoreDisplay">0</span></div>

    <button id="resetBtn">Reset</button>

    <script src="script.js"></script>
</body>
</html>
